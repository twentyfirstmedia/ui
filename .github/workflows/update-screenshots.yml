name: Update screenshots

# Records new screenshot baselines on the same runner image as CI and uploads them as an
# artifact. Download it, copy the files into e2e/screenshots.spec.ts-snapshots, review the
# images and commit them.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm exec playwright test e2e/screenshots.spec.ts --update-snapshots --trace off
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines
          path: e2e/screenshots.spec.ts-snapshots/
          retention-days: 7
