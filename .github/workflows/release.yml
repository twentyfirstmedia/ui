name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

permissions:
  contents: write
  pull-requests: write
  # Trusted Publishing and provenance: npm checks this workflow's identity, and each
  # release links back to the run that built it
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or later; scripts/publish.ts publishes with it
      - run: npm install -g npm@11.21.1
      - run: pnpm install --frozen-lockfile
      # Opens a "Version packages" PR while changesets are pending; publishes to
      # npmjs.com (public, with provenance) once that PR is merged.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: "Version packages"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # only a fallback: with a Trusted Publisher set up on npmjs.com, npm uses OIDC
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
