<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusIndicator — preview</title></head>
<body>
<div class="hq" data-density="compact"><div class="pv" style="">
<div class="stack" style="gap:10px">
 <div class="row" style="gap:20px">
  <span class="hq-status"><i class="hq-shape hq-shape--dot is-ok"></i>Erledigt</span><span class="hq-status"><i class="hq-shape hq-shape--pulse is-info"></i>Arbeitet</span><span class="hq-status"><i class="hq-shape hq-shape--diamond is-signal"></i>Wartet auf Freigabe</span><span class="hq-status"><i class="hq-shape hq-shape--tri is-warn"></i>Budget 82 %</span><span class="hq-status"><i class="hq-shape hq-shape--square is-danger"></i>Fehler</span><span class="hq-status"><i class="hq-shape hq-shape--ring is-idle"></i>Bereit</span>
 </div>
 <div class="row"><span class="hq-badge hq-badge--ok"><i class="hq-shape hq-shape--dot is-ok"></i>Online</span><span class="hq-badge hq-badge--info"><i class="hq-shape hq-shape--pulse is-info"></i>Läuft</span><span class="hq-badge hq-badge--signal"><i class="hq-shape hq-shape--diamond is-signal"></i>Freigabe</span><span class="hq-badge hq-badge--warn"><i class="hq-shape hq-shape--tri is-warn"></i>Läuft ab</span><span class="hq-badge hq-badge--danger"><i class="hq-shape hq-shape--square is-danger"></i>Fehlgeschlagen</span><span class="hq-badge"><i class="hq-shape hq-shape--ring is-idle"></i>Pausiert</span></div>
</div></div></div>
</body>
</html>
