<html>
<head><meta charset="utf-8"><title>Toast — preview</title></head>
<body>
<div class="hq" data-density="compact"><div class="pv" style="">
<div class="stack" style="gap:8px;align-items:flex-end">
 <div class="hq-layer hq-toast"><i class="hq-shape hq-shape--dot is-ok"></i><div class="txt"><b>Freigabe erteilt</b><span>Support-Agent sendet die Antwort an kunde@example.de</span></div><button class="hq-btn hq-btn--sm hq-btn--ghost">Rückgängig</button></div>
 <div class="hq-layer hq-toast"><i class="hq-shape hq-shape--square is-danger"></i><div class="txt"><b>Senden fehlgeschlagen</b><span>SMTP 550 bei hello@jasondevine.de. Zugangsdaten prüfen.</span></div><button class="hq-btn hq-btn--sm">Öffnen</button></div>
</div></div></div>
