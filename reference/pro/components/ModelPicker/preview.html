<!-- @dsCard group="Agents" height=320 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ModelPicker — preview</title></head>
<body>
<div class="hq" data-density="compact"><div class="pv" style="">
<div style="max-width:560px;border:1px solid var(--line-200);background:var(--bg-100)">
 <div class="row" style="padding:10px 12px;border-bottom:1px solid var(--line-200)"><span class="t-title">Modell · Lead Researcher</span><span class="grow"></span><span class="mono muted" style="font-size:12px">~ 1.200 Läufe/Monat</span></div>
 <div class="hq-modelrow"><input type="radio" class="hq-radio" name="m" aria-label="opus"><span><span class="mono" style="color:var(--fg-100)">claude-opus-5-5</span> <span class="muted" style="font-size:12px">Anthropic</span></span><span class="mono">15 / 75 €</span><span class="muted" style="font-size:12px">langsam</span></div>
 <div class="hq-modelrow" aria-selected="true"><input type="radio" class="hq-radio" name="m" checked aria-label="sonnet"><span><span class="mono" style="color:var(--fg-100)">claude-sonnet-5-5</span> <span class="hq-badge" style="margin-left:4px">aktuell</span></span><span class="mono">3 / 15 €</span><span class="muted" style="font-size:12px">mittel</span></div>
 <div class="hq-modelrow"><input type="radio" class="hq-radio" name="m" aria-label="haiku"><span><span class="mono" style="color:var(--fg-100)">claude-haiku-5-5</span> <span class="hq-badge hq-badge--outline" style="margin-left:4px">Rollen-Default</span></span><span class="mono">1 / 5 €</span><span class="muted" style="font-size:12px">schnell</span></div>
 <div class="hq-modelrow"><input type="radio" class="hq-radio" name="m" aria-label="deepseek"><span><span class="mono" style="color:var(--fg-100)">deepseek-v4</span> <span class="muted" style="font-size:12px">DeepSeek</span></span><span class="mono">0,3 / 1,1 €</span><span class="muted" style="font-size:12px">schnell</span></div>
 <div class="row" style="padding:10px 12px"><span class="muted" style="font-size:12px">Preise pro 1 Mio. Tokens (Ein/Aus), Beispielwerte</span><span class="grow"></span><span class="mono" style="font-size:12px">≈ 48 €/Monat</span></div>
</div></div></div>
</body>
</html>
