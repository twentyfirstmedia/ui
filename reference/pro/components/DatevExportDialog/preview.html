<!doctype html>
<html>
<head><meta charset="utf-8"><title>DatevExportDialog — preview</title></head>
<body>
<div class="hq" data-density="compact"><div class="pv" style="padding:0">
<div class="hq-scrim" style="padding:20px;display:flex;justify-content:center">
 <div class="hq-layer hq-dialog" style="width:min(520px,100%)">
  <header><span class="t-heading">DATEV-Export</span><span class="grow"></span><button class="hq-btn hq-btn--icon hq-btn--ghost hq-btn--sm" aria-label="Schließen"><svg class="ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M18 6 6 18" /> <path d="m6 6 12 12" /> </svg></button></header>
  <div class="body">
   <div class="row" style="gap:12px;align-items:flex-end"><div class="hq-field grow"><label class="hq-label">Firma</label><span class="hq-selectwrap"><select class="hq-select"><option>FollowerX GmbH</option></select><svg class="ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m6 9 6 6 6-6" /> </svg></span></div><div class="hq-field"><label class="hq-label">Zeitraum</label><button class="hq-btn" style="background:var(--bg-000)"><svg class="ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M8 2v4" /> <path d="M16 2v4" /> <rect width="18" height="18" x="3" y="4" rx="2" /> <path d="M3 10h18" /> </svg><span class="mono">Q3 2026</span></button></div></div>
   <label class="hq-checkrow"><input type="checkbox" class="hq-check" checked> Belegbilder mitexportieren</label>
   <div style="border:1px solid var(--line-200)"><div class="hq-filerow"><i class="hq-shape hq-shape--dot is-ok"></i><span class="grow">412 Buchungen gebucht</span></div><div class="hq-filerow"><i class="hq-shape hq-shape--tri is-warn"></i><span class="grow">2 Vorschläge noch nicht gebucht</span><a href="#" style="color:var(--fg-200)">Ansehen</a></div><div class="hq-filerow" style="border-bottom:0"><i class="hq-shape hq-shape--tri is-warn"></i><span class="grow">1 Buchung ohne Beleg</span><a href="#" style="color:var(--fg-200)">Ansehen</a></div></div>
  </div>
  <footer><button class="hq-btn">Abbrechen</button><button class="hq-btn hq-btn--primary"><svg class="ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <polyline points="7 10 12 15 17 10" /> <line x1="12" x2="12" y1="15" y2="3" /> </svg>Trotzdem exportieren</button></footer>
 </div>
</div></div></div>
</body>
</html>
