function fill(id, bad){var el=document.getElementById(id);for(var i=0;i<90;i++){var x=document.createElement('i');if(i<6)x.className='none';else if(bad[i]==='w')x.className='warn';else if(bad[i]==='d')x.className='down';el.appendChild(x);}}
fill('u1',{41:'w'}); fill('u2',{22:'w',23:'d',60:'w',88:'w'});
