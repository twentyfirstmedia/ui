<!doctype html>
<html>
<head><meta charset="utf-8"><title>InvoiceEditor — preview</title></head>
<body>
<div class="hq" data-density="compact"><div class="pv" style="">
<div style="border:1px solid var(--line-200);background:var(--bg-100);max-width:820px">
 <div class="hq-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-width:0 0 1px 0">
  <div class="hq-cell"><span class="hq-label">Firma</span><span class="hq-selectwrap"><select class="hq-select"><option>FollowerX GmbH</option></select><svg class="ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m6 9 6 6 6-6" /> </svg></span></div>
  <div class="hq-cell"><span class="hq-label">Kunde</span><span class="hq-selectwrap"><select class="hq-select"><option>Müller Digital GmbH</option></select><svg class="ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m6 9 6 6 6-6" /> </svg></span></div>
  <div class="hq-cell"><span class="hq-label">Format</span><div class="hq-seg"><button>PDF</button><button aria-pressed="true">ZUGFeRD</button><button>XRechnung</button></div></div>
 </div>
 <div style="padding:8px 12px;overflow-x:auto"><table class="hq-lines"><thead><tr><th style="width:40%">Leistung</th><th>Menge</th><th>Einheit</th><th class="num">Preis</th><th>USt</th><th class="num">Summe</th><th></th></tr></thead>
  <tbody><tr><td><input class="hq-input" value="AI-Workflow-Beratung"></td><td><input class="hq-input hq-input--mono" value="16" style="width:60px;text-align:right"></td><td>Std.</td><td class="num"><input class="hq-input hq-input--mono" value="125,00" style="width:90px;text-align:right"></td><td>19 %</td><td class="num">2.000,00</td><td><button class="hq-btn hq-btn--sm hq-btn--ghost hq-btn--icon" aria-label="Zeile entfernen"><svg class="ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M18 6 6 18" /> <path d="m6 6 12 12" /> </svg></button></td></tr>
  <tr><td><input class="hq-input" value="Reisekosten Hamburg"></td><td><input class="hq-input hq-input--mono" value="1" style="width:60px;text-align:right"></td><td>pausch.</td><td class="num"><input class="hq-input hq-input--mono" value="80,00" style="width:90px;text-align:right"></td><td>19 %</td><td class="num">80,00</td><td><button class="hq-btn hq-btn--sm hq-btn--ghost hq-btn--icon" aria-label="Zeile entfernen"><svg class="ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M18 6 6 18" /> <path d="m6 6 12 12" /> </svg></button></td></tr></tbody></table>
  <button class="hq-btn hq-btn--sm hq-btn--ghost" style="margin-top:6px"><svg class="ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M5 12h14" /> <path d="M12 5v14" /> </svg>Position</button></div>
 <div class="row" style="padding:10px 12px;border-top:1px solid var(--line-200);align-items:flex-start"><span class="t-caption">Nummer wird bei Ausstellung vergeben · Zahlungsziel 14 Tage</span><span class="grow"></span><dl class="hq-kv" style="min-width:220px"><dt>Netto</dt><dd class="mono" style="text-align:right">2.080,00 €</dd><dt>USt 19 %</dt><dd class="mono" style="text-align:right">395,20 €</dd><dt style="color:var(--fg-100)">Gesamt</dt><dd class="mono" style="text-align:right;font-weight:600">2.475,20 €</dd></dl></div>
 <div class="row" style="padding:10px 12px;border-top:1px solid var(--line-200);background:var(--bg-000);justify-content:flex-end"><button class="hq-btn">Als Entwurf speichern</button><button class="hq-btn hq-btn--primary"><svg class="ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" /> <path d="m21.854 2.147-10.94 10.939" /> </svg>Ausstellen &amp; senden</button></div>
</div></div></div>
</body>
</html>
