<!doctype html>
<html>
<head><meta charset="utf-8"><title>ConnectionBanner — preview</title></head>
<body>
<div class="hq" data-density="compact"><div class="pv" style="">
<div class="stack" style="gap:8px">
 <div class="hq-banner hq-banner--warn" style="padding:6px 12px"><i class="hq-shape hq-shape--tri is-warn"></i><div class="txt" style="font-size:12px"><b>Verbindung unterbrochen.</b> <span>Neuer Versuch in 4 s · Daten Stand 14:09</span></div><button class="hq-btn hq-btn--sm">Jetzt verbinden</button></div>
 <div class="hq-banner hq-banner--danger" style="padding:6px 12px"><i class="hq-shape hq-shape--square is-danger"></i><div class="txt" style="font-size:12px"><b>Offline.</b> <span>Freigaben und Senden sind gesperrt, bis die Verbindung zurück ist.</span></div></div>
 <div class="hq-banner hq-banner--ok" style="padding:6px 12px"><i class="hq-shape hq-shape--dot is-ok"></i><div class="txt" style="font-size:12px"><b>Wieder verbunden.</b></div></div>
</div></div></div>
