<!doctype html>
<html>
<head><meta charset="utf-8"><title>DatePicker — preview</title></head>

<div class="hq" data-density="compact"><div class="pv" style="">

 <div class="hq-layer" style="display:flex;flex-wrap:wrap">

   <div class="grid"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span>
    <button class="out">28</button><button class="out">29</button><button class="out">30</button><button class="sel">1</button><button class="in">2</button><button class="in">3</button><button class="in">4</button>

    <button class="in">26</button><button class="in">27</button><button class="in">28</button><button class="in">29</button><button class="in">30</button><button class="sel">31</button><button class="out">1</button>
   </div>
  </div>
 </div>
</div></div></div>
