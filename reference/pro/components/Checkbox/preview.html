<!doctype html>
<html>
<head><meta charset="utf-8"><title>Checkbox — preview</title></head>
<body>
<div class="hq" data-density="compact"><div class="pv" style="">
<div class="row" style="gap:20px">
 <label class="hq-checkrow"><input type="checkbox" class="hq-check" checked> Gelesen</label>
 <label class="hq-checkrow"><input type="checkbox" class="hq-check" id="ind"> Alle auswählen</label>
 <label class="hq-checkrow"><input type="checkbox" class="hq-check"> Nur mit Anhang</label>
 <span style="width:1px;height:16px;background:var(--line-200)"></span>
 <label class="hq-checkrow"><input type="radio" name="r" class="hq-radio" checked> Netto</label>
 <label class="hq-checkrow"><input type="radio" name="r" class="hq-radio"> Brutto</label>
</div></div></div>
<script>
document.getElementById('ind').indeterminate = true;
</script>
</body>
</html>
