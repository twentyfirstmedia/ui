<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>HQ · Mobile · Sprachgespräch</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="hq-tokens.css">
<link rel="stylesheet" href="ds/hq/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #09090b; font-family: 'Geist', sans-serif; color: #ededf0; overflow: hidden;">
<dc-import name="Mobile-Chats" start="fp-support" voice="1" theme="{{theme}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
