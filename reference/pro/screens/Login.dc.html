<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>HQ · Anmelden</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="hq-tokens.css">
<link rel="stylesheet" href="ds/hq/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="hq" data-theme="{{theme}}" data-density="comfortable" style="background: var(--bg-000); color: var(--fg-100); font-family: var(--font-sans); min-height: 900px; display: flex; flex-wrap: wrap; align-items: stretch;">

 <section class="hq-gridbg" style="flex: 1 1 520px; min-width: 0; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 48px; border-right: 1px solid var(--line-200); background-color: var(--bg-000);">
  <span class="hq-wordmark"><b>HQ</b><span>twentyfirst</span></span>
  <div class="hq-marks" style="align-self: flex-start; padding: 32px; background: var(--bg-100); border: 1px solid var(--line-200); max-width: 460px; display: flex; flex-direction: column; gap: 16px;">
   <span class="hq-mark tl"></span><span class="hq-mark tr"></span><span class="hq-mark bl"></span><span class="hq-mark br"></span>
   <span style="font: 600 96px/0.9 var(--font-sans); letter-spacing: -0.045em;">HQ</span>
   <span class="t-body" style="color: var(--fg-300);">Das Cockpit für Agents, Freigaben, Mail, Domains und Finanzen.</span>
  </div>
  <div style="display: flex; gap: 16px; color: var(--fg-300); font-size: 12px; flex-wrap: wrap;"><span class="mono">hq.twentyfirst.media</span><span>Nur für eingeladene Admins</span></div>
 </section>

 <section style="flex: 1 1 460px; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 48px 24px; background: var(--bg-100);">
  <form style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 20px;">
   <div style="display: flex; flex-direction: column; gap: 6px;"><span class="eyebrow">Anmelden</span><h1 class="t-display" style="margin: 0;">Willkommen zurück</h1></div>
   <button class="hq-btn hq-btn--primary" type="button" style="height: 44px; font-size: 14px;"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>Mit Passkey anmelden</button>
   <div style="display: flex; align-items: center; gap: 12px; color: var(--fg-300); font-size: 12px;"><span style="flex: 1; height: 1px; background: var(--line-200);"></span>oder mit Code<span style="flex: 1; height: 1px; background: var(--line-200);"></span></div>
   <div class="hq-field"><label for="email">E-Mail</label><input id="email" class="hq-input" type="email" value="robin@twentyfirst.media"></div>
   <div class="hq-field"><label for="totp">Code aus der Authenticator-App</label><input id="totp" class="hq-input hq-input--mono" inputmode="numeric" autocomplete="one-time-code" placeholder="000 000" style="letter-spacing: 0.3em; font-size: 16px;"><span class="hq-hint">6 Ziffern. Kein Zugriff auf die App? <a href="#" style="color: var(--fg-200);">Wiederherstellungscode nutzen</a></span></div>
   <button class="hq-btn" type="submit" style="height: 40px;">Anmelden<svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
   <div style="display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line-200); color: var(--fg-300); font-size: 12px;"><svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>Zusätzlich geschützt durch Cloudflare Access</div>
  </form>
 </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
