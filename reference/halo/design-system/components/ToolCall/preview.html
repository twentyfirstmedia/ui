<!doctype html>
<html>
<head><meta charset="utf-8"><title>ToolCall</title></head>
<body>
<div id="root" class="ha-pad"></div>
<script>
  var H = window.Halo, h = React.createElement, useState = React.useState;

  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ha-panel', style: { gap: 8 } },
    h(H.Reasoning, { steps: ['Find the latest thread from Northwind', 'Check seat pricing and the renewal date', 'Draft a short reply, ask before sending'], duration: '1.4 s', defaultOpen: true }),
    h(H.ToolCall, { name: 'Mailbox', icon: 'mail', status: 'done', summary: 'Read 3 messages in “Seat upgrade”', duration: '0.8 s', defaultOpen: true, input: { query: 'from:ida@northwind.io', limit: 3 }, output: { messages: 3, latest: 'We need 40 more seats before 1 May.' } }),
    h(H.ToolCall, { name: 'Knowledge base', icon: 'book', status: 'running', summary: 'Searching “seat upgrade pricing”' }),
    h(H.ToolCall, { name: 'Run checks', icon: 'terminal', status: 'error', summary: '146 passed · 1 type error', duration: '4.2 s', output: "Seats.tsx:42  Type 'string' is not assignable to type 'number'." }),
    h(H.ToolCall, { name: 'Deployments', icon: 'zap', status: 'waiting', summary: 'Needs approval to deploy to production' }),
    h(H.Reasoning, { streaming: true })));
</script>
</body>
</html>
