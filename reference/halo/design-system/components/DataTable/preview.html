<!-- @dsCard group="Data" height=440 width=960 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root" class="ha-pad"></div>
<script>
  var H = window.Halo, h = React.createElement, useState = React.useState;

  var ROWS = [
    { id: 1, name: 'Ava Vogel', email: 'ava@halo.app', role: 'Editor', team: 'Engineering', status: 'Active', seats: 3 },
    { id: 2, name: 'Ben Okafor', email: 'ben@halo.app', role: 'Viewer', team: 'Sales', status: 'Invited', seats: 1 },
    { id: 3, name: 'Clara Haddad', email: 'clara@halo.app', role: 'Admin', team: 'Design', status: 'Active', seats: 5 },
    { id: 4, name: 'Elif Sato', email: 'elif@halo.app', role: 'Editor', team: 'Engineering', status: 'Away', seats: 2 },
    { id: 5, name: 'Jonah Petit', email: 'jonah@halo.app', role: 'Editor', team: 'Growth', status: 'Active', seats: 4 }];
  var TONE = { Active: 'success', Invited: 'info', Away: 'warning' };
  function App() {
    var f = useState({ Team: 'Engineering' }), q = useState('');
    var rows = ROWS.filter(function (r) { return (!f[0].Team || r.team === f[0].Team) && (!f[0].Status || r.status === f[0].Status) && (!q[0] || r.name.toLowerCase().indexOf(q[0].toLowerCase()) >= 0); });
    return h('div', { className: 'ha-col', style: { gap: 16 } },
      h(H.FilterBar, { search: 'Search people', query: q[0], onQuery: q[1], value: f[0], onChange: f[1], filters: [{ key: 'Team', label: 'Team', options: ['Design', 'Engineering', 'Growth', 'Sales'] }, { key: 'Status', label: 'Status', options: ['Active', 'Invited', 'Away'] }] }),
      h('div', { className: 'ha-panel ha-panel-flush' }, h(H.DataTable, { rows: rows, selectable: true, stickyHeader: true, defaultSort: { key: 'name', dir: 'asc' },
        toolbar: h('span', { className: 'ha-card-desc' }, rows.length + ' of ' + ROWS.length),
        bulkActions: [{ label: 'Change role', icon: 'edit', onClick: function () {} }, { label: 'Remove', icon: 'trash', danger: true, onClick: function (r, clear) { clear(); } }],
        renderExpanded: function (r) { return h('span', { className: 'ha-card-desc' }, r.email + ' · ' + r.seats + ' seats assigned'); },
        columns: [
          { key: 'name', label: 'Name', sortable: true, hideable: false, render: function (r) { return h('span', { className: 'ha-row', style: { flexWrap: 'nowrap' } }, h(H.Avatar, { name: r.name, size: 28 }), h('b', null, r.name)); } },
          { key: 'role', label: 'Role', sortable: true }, { key: 'team', label: 'Team', sortable: true },
          { key: 'status', label: 'Status', sortable: true, render: function (r) { return h(H.Badge, { tone: TONE[r.status] }, r.status); } },
          { key: 'seats', label: 'Seats', align: 'right', sortable: true }] })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
