<html>
<head><meta charset="utf-8"><title>OrderTimeline</title></head>
<body>
<div id="root" class="ha-pad"></div>
<script>

  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ha-panel', style: { gap: 32 } },
    h(H.OrderTimeline, { status: 'Shipped', times: { Placed: '12 Apr, 09:14', Paid: '12 Apr, 09:15', Packed: '12 Apr, 15:40', Shipped: '13 Apr, 08:02' } }),
    h(H.OrderTimeline, { status: 'Paid', times: { Placed: 'Just now', Paid: 'Just now' } }),
    h(H.OrderTimeline, { status: 'Refunded' })));
</script>
</body>
