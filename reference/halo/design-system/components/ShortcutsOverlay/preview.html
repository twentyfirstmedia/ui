<!-- @dsCard group="Overlays" height=520 width=900 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root" class="ha-pad"></div>
<script>
  var H = window.Halo, h = React.createElement, useState = React.useState;
  function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }

  function App() { var o = useState(true);
    return h('div', { style: { position: 'relative', height: 460 } }, h(H.Button, { onClick: function () { o[1](true); } }, 'Show shortcuts (?)'),
      h(H.ShortcutsOverlay, { open: o[0], onClose: function () { o[1](false); }, groups: [{ title: 'Global', items: [['Search', ['⌘', 'K']], ['Shortcuts', ['?']]] }, { title: 'Navigation', items: [['Go to chats', ['G', 'C']], ['Go to approvals', ['G', 'A']]] }, { title: 'Approvals', items: [['Run as shown', ['A']], ['With a change', ['B']], ['Discard', ['C']], ['Other instruction', ['D']], ['Next / previous', ['J', 'K']]] }] }));
  }
  render(h(App));
</script>
</body>
</html>
