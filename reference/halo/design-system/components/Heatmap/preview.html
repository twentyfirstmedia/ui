<!doctype html>

<body>
<div id="root" class="ha-pad"></div>
<script>
  var H = window.Halo, h = React.createElement, useState = React.useState;

  var vals = [0, 1, 2, 3, 4, 5, 6].map(function (d) { return Array.from({ length: 24 }, function (_, hr) { var w = d < 5 ? 1 : 0.35; return Math.round(48 * w * (Math.exp(-Math.pow((hr - 11) / 3.2, 2)) + 0.7 * Math.exp(-Math.pow((hr - 16) / 2.6, 2))) + ((d * 31 + hr * 17) % 7)); }); });
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ha-panel' }, h('div', null, h('h3', { className: 'ha-panel-title' }, 'When people sign up'), h('p', { className: 'ha-panel-sub' }, 'By weekday and hour')),
    h(H.Heatmap, { rows: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], cols: Array.from({ length: 24 }, function (_, i) { return (i < 10 ? '0' : '') + i; }), colEvery: 3, values: vals, caption: 'Hover a cell for the count', format: function (v) { return v + ' sign-ups'; } })));
</script>
