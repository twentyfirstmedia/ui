<!doctype html>
<html>
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root" class="ha-pad"></div>
<script>
  var H = window.Halo, h = React.createElement, useState = React.useState;

  function App() {
    React.useEffect(function () {
      H.toast({ text: 'Invoice #2097 sent to Northwind', tone: 'success', duration: 600000 });
      H.toast({ text: '2 people removed', tone: 'danger', icon: 'trash', undo: function () { H.toast({ text: 'Restored', tone: 'info', duration: 600000 }); }, duration: 600000 });
    }, []);
    return h('div', { className: 'ha-panel', style: { gap: 12 } },
      h('div', { className: 'ha-row' },
        h(H.Button, { variant: 'soft', onClick: function () { H.toast('Profile saved'); } }, 'Success'),
        h(H.Button, { variant: 'soft', onClick: function () { H.toast({ text: 'Build started for halo-web', tone: 'info' }); } }, 'Info'),
        h(H.Button, { variant: 'soft', onClick: function () { H.toast({ text: 'Project archived', undo: function () { H.toast('Restored'); } }); } }, 'With undo')),
      h('p', { className: 'ha-card-desc', style: { margin: 0 } }, 'Toasts stack bottom-center above the dock, three at most. Hover pauses the timer.'),
      h(H.Toaster));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
