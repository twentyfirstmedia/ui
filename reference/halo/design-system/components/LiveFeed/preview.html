<!doctype html>
<html>
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root" class="ha-pad"></div>
<script>
  var H = window.Halo, h = React.createElement, useState = React.useState;
  function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }

  var types = [{ value: 'order', label: 'Orders' }, { value: 'payment', label: 'Payments' }, { value: 'error', label: 'Errors' }];
  var seed = [{ id: 1, type: 'order', icon: 'cart', tint: 'mint', title: '1,000 Instagram followers', text: 'Order #48213 · Germany · PayPal', amount: 12.9, time: '2s' }, { id: 2, type: 'payment', icon: 'card', tint: 'sky', title: 'Payment received', text: 'Stripe · card ending 4242', amount: 39, time: '14s' }, { id: 3, type: 'error', icon: 'zap', tint: 'blush', title: 'Provider timeout', text: 'SMM provider B · retried', time: '41s' }, { id: 4, type: 'order', icon: 'cart', tint: 'mint', title: '5,000 TikTok views', text: 'Order #48212 · Austria', amount: 4.9, time: '1m' }];
  function App() { var it = useState(seed);
    React.useEffect(function () { var n = 100; var t = setInterval(function () { n++; it[1](function (l) { return [{ id: n, type: 'order', icon: 'cart', tint: 'mint', title: (n % 3 + 1) * 500 + ' Instagram likes', text: 'Order #' + (48213 + n - 100) + ' · Switzerland', amount: 2.9 + n % 5, time: 'now', fresh: true }].concat(l.slice(0, 7)); }); }, 2600); return function () { clearInterval(t); }; }, []);
    return h('div', { style: { display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 16, alignItems: 'start' } },
      h('div', { className: 'ha-panel' }, h(H.LiveFeed, { items: it[0], types: types, maxHeight: 420 })),
      h('div', { className: 'ha-panel', style: { gap: 12 } }, h('b', null, 'Revenue by country'), h(H.BarList, { format: function (v) { return H.formatMoney(v); }, items: [{ label: 'Germany', mark: '🇩🇪', value: 18240, share: .52 }, { label: 'Austria', mark: '🇦🇹', value: 6120, share: .17 }, { label: 'Switzerland', mark: '🇨🇭', value: 5480, share: .16, tint: 'mint' }, { label: 'Netherlands', mark: '🇳🇱', value: 2210, share: .06, tint: 'butter' }, { label: 'Other', value: 3100, share: .09, tint: 'lilac' }] })));
  }
  render(h(App));
</script>
</body>
</html>
