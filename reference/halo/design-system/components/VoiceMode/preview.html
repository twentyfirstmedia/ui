<!doctype html>
<html>
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root" class="ha-pad"></div>
<script>
  var H = window.Halo, h = React.createElement, useState = React.useState;
  function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }

  function App() { var s = useState('listening');
    return h('div', { className: 'ha-col', style: { gap: 16 } }, h(H.Segmented, { value: s[0], onChange: s[1], options: ['listening', 'thinking', 'speaking', 'idle'] }),
      h(H.VoiceMode, { name: 'Atlas', tint: 'sky', state: s[0], transcript: s[0] === 'speaking' ? '“I drafted the reply. Should I send it?”' : null, onMute: function () {}, onEnd: function () {} }));
  }
  render(h(App));
</script>
</body>
</html>
