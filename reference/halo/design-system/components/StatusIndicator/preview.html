<!doctype html>
<html>
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root" class="ha-pad"></div>
<script>
  var H = window.Halo, h = React.createElement, useState = React.useState;
  function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }

  var S = [['ok', 'Done'], ['running', 'Working'], ['signal', 'Waiting for approval'], ['warn', 'Paused · budget'], ['danger', 'Failed'], ['idle', 'Ready']];
  render(h('div', { className: 'ha-panel', style: { gap: 24 } },
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 16 } }, S.map(function (s) { return h(H.StatusIndicator, { key: s[0], status: s[0], label: s[1] }); })),
    h('div', { className: 'ha-row' }, [['success', 'Live'], ['info', 'Pending'], ['highlight', 'Needs review'], ['warning', 'Expiring'], ['danger', 'Overdue'], ['neutral', 'Draft']].map(function (b) { return h(H.Badge, { key: b[0], tone: b[0] }, b[1]); }))));
</script>
</body>
</html>
