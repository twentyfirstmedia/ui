<!doctype html>
<html>
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root" class="ha-pad"></div>
<script>
  var H = window.Halo, h = React.createElement, useState = React.useState;
  function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }

  var tree = [{ id: 'fx', label: 'FollowerX GmbH', meta: '€48,210', children: [{ id: 'fp', label: 'FollowerPilot', meta: '€31,400', children: [{ id: 'ads', label: 'Ads', meta: '€9,800' }, { id: 'smm', label: 'SMM providers', meta: '€14,100' }] }, { id: 'ch', label: 'Chatteo', meta: '€12,610' }] }, { id: 'tv', label: 'Trepte Ventures UG', meta: '€4,200' }];
  function App() { var s = useState('ads');
    return h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 } },
      h('div', { className: 'ha-panel', style: { padding: 12 } }, h(H.TreeView, { items: tree, defaultOpen: ['fx', 'fp'], selected: s[0], onSelect: s[1], label: 'Cost centres' })),
      h('div', { className: 'ha-panel', style: { gap: 16 } }, h('span', { className: 'ha-card-desc' }, 'Double-click or Enter to edit'),
        h(H.KeyValue, { items: [['Category', h(H.InlineEdit, { value: 'Software', options: ['Software', 'Hosting', 'Marketing'] })], ['Amount', h(H.InlineEdit, { value: '1,240.00', mono: true })]] }),
        h(H.ContextMenu, { items: [{ label: 'Open', icon: 'eye' }, { label: 'Rename', icon: 'edit', shortcut: 'R' }, '-', { label: 'Delete', icon: 'trash', danger: true }] }, h('div', { className: 'ha-emptybox', style: { padding: 24, borderRadius: 16, background: 'var(--canvas)', textAlign: 'center' } }, 'Right-click or long-press here'))));
  }
  render(h(App));
</script>
</body>
</html>
