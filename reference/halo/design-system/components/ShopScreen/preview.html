<!-- @dsCard group="Pages" height=900 width=1280 page subtitle="Shop overview: KPIs, low-stock alert, sales by channel, funnel, top products, recent orders" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ShopScreen</title></head>
<body>
<div id="root" style="padding: 16px;"></div>
<script>
  var H = window.Halo, h = React.createElement, useState = React.useState;
    var AREAS = [['Workspace', 'home'], ['Customers', 'users'], ['Shop', 'cart'], ['Agents', 'bot'], ['Mail', 'mail'], ['Code', 'code'], ['Domains', 'globe'], ['Finance', 'card'], ['Files', 'folder'], ['Account', 'settings']];
  function Shell(p) {
    return h('div', { className: 'ha-shell', style: { position: 'relative' } },
      h(H.TopBar, { brand: 'Halo', tag: 'Admin', active: p.area, items: AREAS.map(function (a) { return { label: a[0], icon: a[1], count: a[0] === 'Mail' ? 2 : null }; }), user: { name: 'Mara Ellis', email: 'mara@halo.app' },
        extra: [h('button', { key: 's', type: 'button', className: 'ha-topbtn', 'aria-label': 'Search' }, h(H.Icon, { name: 'search', size: 15 }), 'Search', h('kbd', null, '⌘K')), h('button', { key: 'b', type: 'button', className: 'ha-topbtn icon', 'aria-label': 'Notifications' }, h(H.Icon, { name: 'bell', size: 17 }), h('span', { className: 'ha-nav-count' }, 4))] }),
      h('div', { className: 'ha-sheet', style: { gridTemplateColumns: '208px minmax(0, 1fr)' + (p.side ? ' 304px' : ''), alignItems: 'start' } },
        h(H.SubNav, { eyebrow: p.area, action: p.action, current: p.current, items: p.pages }),
        h('main', { className: 'ha-main' }, p.children), p.side || null),
      p.overlay || null);
  }

  function App() {
    var pages = [{ id: 'Overview', label: 'Overview', icon: 'chart' }, { id: 'Products', label: 'Products', icon: 'package' }, { id: 'Orders', label: 'Orders', icon: 'truck', count: 8 }, { id: 'Storefront', label: 'Storefront', icon: 'cart' }];
    return h(Shell, { area: 'Shop', current: 'Overview', action: { label: 'Add product', icon: 'plus' }, pages: pages },
      h(H.PageHeader, { title: 'Shop', subtitle: 'Halo Goods · last 7 days', actions: [h(H.Button, { key: 'v', variant: 'secondary', icon: 'arrowUpRight' }, 'View store')] }),
      h(H.Alert, { tone: 'warning', title: '3 products are running low', action: h(H.Button, { size: 'sm', variant: 'secondary' }, 'Review stock') }, 'Studio Mug (6 left), Canvas Tote (sold out), Court Sneaker (9 left).'),
      h('div', { className: 'ha-grid', style: { gridTemplateColumns: 'repeat(4, minmax(0, 1fr))' } }, h(H.StatTile, { tint: 'butter', value: '€5,592', label: 'Revenue' }), h(H.StatTile, { tint: 'sky', value: '36', label: 'Orders' }), h(H.StatTile, { tint: 'mint', value: '€155', label: 'Average order' }), h(H.StatTile, { tint: 'placeholder', value: '11', label: 'To fulfil' })),
      h('div', { className: 'ha-grid', style: { gridTemplateColumns: 'minmax(0, 1.6fr) minmax(0, 1fr)' } },
        h(H.Panel, { title: 'Sales by channel' }, h(H.StackedBarChart, { height: 160, labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], format: function (v) { return '€' + Math.round(v); }, series: [{ name: 'Online store', tint: 'sky', values: [420, 380, 510, 460, 620, 840, 760] }, { name: 'Instagram', tint: 'lilac', values: [120, 160, 140, 210, 260, 380, 300] }, { name: 'Marketplace', tint: 'butter', values: [90, 110, 80, 130, 150, 170, 160] }] })),
        h(H.Panel, { title: 'Conversion' }, h(H.Funnel, { steps: [{ label: 'Visited', value: 8420 }, { label: 'Viewed product', value: 3910 }, { label: 'Added to cart', value: 812 }, { label: 'Ordered', value: 214 }] }))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
