<!doctype html>
<html>
<head><meta charset="utf-8"><title>AuthCard</title></head>
<body>
<div id="root" class="ha-pad"></div>
<script>
  var H = window.Halo, h = React.createElement, useState = React.useState;

  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 16, alignItems: 'start' } },
    h(H.AuthCard, { title: 'Welcome back', text: 'Sign in to the Halo workspace.', foot: 'New here? Create a workspace' }, h(H.TextField, { label: 'Email', icon: 'mail', defaultValue: 'mara@halo.app' }), h(H.TextField, { label: 'Password', type: 'password', icon: 'lock', defaultValue: 'secret-pass' }), h(H.Button, null, 'Sign in')),
    h(H.AuthCard, { icon: 'key', tint: 'butter', title: 'Reset your password', text: 'We’ll email you a link to choose a new one.', foot: 'Back to sign in' }, h(H.TextField, { label: 'Email', icon: 'mail', defaultValue: 'mara@halo.app' }), h(H.Button, { icon: 'send' }, 'Send reset link')),
    h(H.AuthCard, { icon: 'shield', tint: 'sky', title: 'Enter your code', text: 'Type the 6-digit code from your authenticator app.', foot: 'Use a recovery code instead' }, h(H.OtpInput, null))));
</script>
</body>
</html>
