<!doctype html>
<html>
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root" class="ha-pad"></div>
<script>
  var H = window.Halo, h = React.createElement, useState = React.useState;

  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ha-panel', style: { flexDirection: 'row', justifyContent: 'space-around', flexWrap: 'wrap', gap: 24 } },
    h(H.Gauge, { value: 60, max: 75, caption: '80% of monthly target', format: function (v) { return '€' + v + 'k'; }, tint: 'mint' }),
    h(H.Gauge, { value: 72, max: 100, thresholds: [60, 85], caption: 'Agent budget used', format: function (v) { return v + '%'; } }),
    h(H.Gauge, { value: 91, max: 100, thresholds: [60, 85], caption: 'Storage used', format: function (v) { return v + '%'; } })));
</script>
</body>
</html>
