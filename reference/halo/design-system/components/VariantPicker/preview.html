<!doctype html>
<html>
<head><meta charset="utf-8"><title>VariantPicker</title></head>
<body>
<div id="root" class="ha-pad"></div>
<script>
  var H = window.Halo, h = React.createElement, useState = React.useState;

  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ha-panel', style: { gap: 24 } },
    h(H.VariantPicker, { label: 'Colour', type: 'color', defaultValue: 'Sky', options: [{ value: 'Sky', label: 'Sky', color: '#9fc3f0' }, { value: 'Ink', label: 'Ink', color: '#1d1d1f' }, { value: 'Bone', label: 'Bone', color: '#ece6d9' }, { value: 'Moss', label: 'Moss', color: '#7d9a5e', disabled: true }] }),
    h(H.VariantPicker, { label: 'Size', defaultValue: 'M', options: [{ value: 'XS', label: 'XS', disabled: true }, 'S', 'M', 'L', 'XL'] })));
</script>
</body>
</html>
