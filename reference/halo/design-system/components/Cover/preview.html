<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Halo — cover</title>
<style>
  html, body { margin: 0; background: var(--canvas); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--canvas); }
  .cv svg { position: absolute; inset: 0; }
  .frame { fill: var(--frame); } .sky { fill: var(--sky); } .mint { fill: var(--mint); } .lilac { fill: var(--lilac); } .butter { fill: var(--butter); } .blush { fill: var(--blush); } .surf { fill: var(--surface); }
  [data-theme="dark"] .frame { fill: var(--line-strong); }
  .slab { rx: var(--radius-xl); ry: var(--radius-xl); }
  .tile { rx: var(--radius-lg); ry: var(--radius-lg); }
  .txt { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .name { font: 800 120px/0.92 var(--font-sans); letter-spacing: -0.04em; color: var(--ink); margin: 0; }
  .tag { font: 500 14px/20px var(--font-sans); color: var(--ink-muted); margin: 12px 0 0; }
</style>
</head>
<body>
<div class="cv">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <!--
      blocks: frame 200×236 (radius-xl), sky 152×104 (radius-lg), butter 152×112 (radius-lg), lilac pill 160×64, mint pill 120×64 — all from space-8 multiples
      arrangement: one tall dark slab with tinted satellites, the slab bleeding off the bottom edge, as the app frame wraps the workspace
      pattern: discs and pills from radius-pill — "everything clickable is a pill" is the system's soft, friendly signature
      steps/radii: gaps space-4 (16) and space-6 (24); radius-lg, radius-xl, radius-pill (half the short side)
    -->
    <rect class="frame slab" x="520" y="40" width="200" height="300"/>
    <rect class="surf tile" x="544" y="64" width="152" height="40"/>
    <circle class="mint" cx="564" cy="84" r="8"/>
    <rect class="sky tile" x="744" y="40" width="152" height="104"/>
    <rect class="butter tile" x="744" y="160" width="152" height="112"/>
    <rect class="lilac" x="544" y="128" width="160" height="64" rx="32" ry="32"/>
    <rect class="mint" x="544" y="208" width="120" height="64" rx="32" ry="32"/>
    <circle class="blush" cx="912" cy="40" r="24"/>
    <circle class="frame" cx="704" cy="240" r="32"/>
    <circle class="surf" cx="704" cy="240" r="12"/>
  </svg>
  <div class="txt">
    <p class="name">Halo</p>
    <p class="tag">Soft, rounded dashboard UI: pastel meaning, ink accents.</p>
  </div>
</div>
</body>
</html>
