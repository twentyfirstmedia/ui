.ha-voice-name { font: 700 20px/26px var(--font-sans); margin-top: 8px; }
.ha-voice-state { font: 500 13px/18px var(--font-sans); color: var(--on-frame-muted); }
.ha-voice-wave { display: flex; align-items: center; gap: 4px; height: 48px; }

.ha-voice.is-thinking .ha-voice-wave i { animation-duration: 2.2s; opacity: .4; }
.ha-voice.is-idle .ha-voice-wave i { animation: none; opacity: .3; }
@keyframes ha-wave { 0%, 100% { height: 8px; } 50% { height: 40px; } }
.ha-voice-transcript { margin: 0; max-width: 480px; font: 500 14px/22px var(--font-sans); color: var(--on-frame); }
.ha-voice-end { display: grid; place-items: center; width: 48px; height: 48px; border: 0; border-radius: 50%; background: var(--blush-ink); color: var(--surface); cursor: pointer; }
.ha-voice-end:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Operations */
.ha-conn { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ha-conn .ha-option-text { flex: 1; padding: 0; }
.ha-conn-ico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--surface-sunken); color: var(--ink); flex: none; overflow: hidden; }
.ha-conn-ico img, .ha-conn-ico svg { max-width: 24px; max-height: 24px; }
.ha-connbanner { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 32px; padding: 4px 16px; font: 600 12px/16px var(--font-sans); color: var(--ink); background: var(--warn-bg); }
.ha-connbanner .ha-shape { color: var(--warn); } .ha-connbanner.offline { background: var(--danger-bg); } .ha-connbanner.offline .ha-shape { color: var(--danger); }
.ha-connbanner .ha-linkbtn { height: 24px; color: var(--ink); text-decoration: underline; }
.ha-server { display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: var(--radius-lg); background: var(--surface); min-width: 0; }
.ha-server-top { display: flex; align-items: center; gap: 12px; } .ha-server-top .ha-option-text { flex: 1; padding: 0; }
.ha-server-foot { padding-top: 12px; border-top: 1px solid var(--line); font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.ha-pipeline { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, 1fr); gap: 8px; margin: 0; padding: 0; list-style: none; overflow-x: auto; }
.ha-stage { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 12px 16px 16px; border-radius: var(--radius-md); background: var(--canvas); }
.ha-stage b { font: 600 13px/18px var(--font-sans); margin-top: 4px; } .ha-stage small { font-size: 12px; color: var(--ink-muted); }
.ha-stage::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 8px; height: 3px; border-radius: 2px; background: transparent; }
.ha-stage.st-running::after { background: var(--info); animation: ha-pulse 1.4s ease-in-out infinite; } .ha-stage.st-danger::after { background: var(--danger); } .ha-stage.st-done::after, .ha-stage.st-ok::after { background: var(--ok); } .ha-stage.st-signal::after { background: var(--signal); }
.ha-stage .ha-shape { color: var(--idle); } .ha-stage.st-done .ha-shape, .ha-stage.st-ok .ha-shape { color: var(--ok); } .ha-stage.st-running .ha-shape { color: var(--info); } .ha-stage.st-danger .ha-shape { color: var(--danger); } .ha-stage.st-signal .ha-shape { color: var(--signal); }
.ha-trunc { display: inline-block; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
.ha-domains { display: flex; flex-direction: column; gap: 4px; }
.ha-domainrow { display: grid; grid-template-columns: 12px minmax(0, 1fr) 96px 120px; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.ha-domainrow:hover { background: var(--canvas); } .ha-domainrow .ha-option-text { padding: 0; }
.ha-domainrow-cell { display: flex; flex-direction: column; gap: 2px; } .ha-domainrow-cell small { font: 600 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.ha-scroll-x { overflow-x: auto; min-width: 0; }
.ha-mailauth-cell { border: 0; background: none; padding: 4px 8px; margin: -4px -8px; border-radius: var(--radius-sm); cursor: pointer; }
.ha-mailauth-cell:hover { background: var(--surface-sunken); }
.ha-neg { color: var(--danger); }
.ha-pnl tr.section td { padding-top: 24px; font: 600 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); border-bottom: 0; height: auto; }
.ha-pnl tr.subtotal td { font-weight: 700; border-top: 1px solid var(--line-strong); }
.ha-pnl tr.total td { font: 700 15px/22px var(--font-sans); border-top: 2px solid var(--ink); }
.ha-receipt { display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ha-receipt-src { display: flex; align-items: center; gap: 12px; } .ha-receipt-src .ha-option-text { padding: 0; }
.ha-receipt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.ha-receipt-field { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: var(--radius-md); background: var(--canvas); }
.ha-receipt-field small { font: 600 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.ha-receipt-field b { font: 600 14px/20px var(--font-sans); }
.ha-conf { font: 600 11px/14px var(--font-sans); color: var(--ok); } .ha-conf.low { color: var(--warn); }
.ha-receipt-sugg { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--signal-bg); font: 500 13px/18px var(--font-sans); }
.ha-receipt-sugg .ha-shape { color: var(--signal); }

/* Mail */
.ha-acct { display: inline-flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 16px; border: 0; border-radius: var(--radius-pill); background: var(--surface-sunken); color: var(--ink); text-align: left; cursor: pointer; max-width: 100%; }
.ha-acct .ha-option-text { padding: 0; min-width: 0; }
.ha-acct:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ha-acct-list { display: flex; flex-direction: column; max-height: 320px; overflow: auto; }
.ha-acct-list .ha-option { border: 0; background: none; color: var(--ink); text-align: left; }
.ha-acct-list .ha-option.on { background: var(--surface-sunken); }
.ha-inboxlist { display: flex; flex-direction: column; gap: 2px; }
.ha-mailrow { display: flex; gap: 12px; padding: 12px 16px 12px 8px; border: 0; border-radius: var(--radius-md); background: transparent; text-align: left; cursor: pointer; color: var(--ink); }
.ha-mailrow:hover { background: var(--canvas); } .ha-mailrow.on { background: var(--surface-sunken); }
.ha-mailrow:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.ha-mailrow-dot { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; flex: none; }
.ha-mailrow.unread .ha-mailrow-dot { background: var(--info); }
.ha-mailrow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ha-mailrow-top { display: flex; justify-content: space-between; gap: 8px; }
.ha-mailrow-top b { font: 500 14px/20px var(--font-sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .ha-mailrow.unread .ha-mailrow-top b { font-weight: 700; }
.ha-mailrow-top small { font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
.ha-mailrow-subject { font: 600 13px/18px var(--font-sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ha-mailrow-snippet { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ha-mailrow-tags { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--ink-muted); }
.ha-thread { display: flex; flex-direction: column; gap: 8px; }
.ha-thread-subject { margin: 0 0 8px; font: 700 20px/26px var(--font-sans); }
.ha-threadmsg { border-radius: var(--radius-md); background: var(--canvas); }
.ha-threadmsg.open { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ha-threadmsg.agent { box-shadow: inset 3px 0 0 var(--signal); }
.ha-threadmsg-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; }
.ha-threadmsg-head .ha-option-text { flex: 1; padding: 0; min-width: 0; }
.ha-threadmsg-head small { color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ha-threadmsg-note { font-weight: 500; color: var(--signal); }
.ha-threadmsg-body { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 16px 60px; font: 500 14px/22px var(--font-sans); white-space: pre-wrap; }
.ha-sig { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
.ha-sig-preview { display: flex; flex-direction: column; gap: 8px; }
.ha-paper { background: var(--paper); color: var(--paper-ink); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
.ha-sig-paper { padding: 20px; font: 500 13px/20px var(--font-sans); }
.ha-sig-paper p { margin: 0 0 8px; color: var(--paper-muted); } .ha-sig-paper small { display: block; margin-top: 8px; color: var(--paper-subtle); }
.ha-attprev { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(240px, 1fr); gap: 24px; }
.ha-attprev-doc { border-radius: var(--radius-md); background: var(--surface-sunken); padding: 16px; min-height: 360px; overflow: auto; }

/* App chrome */
.ha-tabbar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px 8px calc(4px + env(safe-area-inset-bottom, 0px)); background: var(--frame); border-radius: 24px 24px 0 0; }
.ha-tabbar-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 56px; border: 0; background: none; color: var(--on-frame-muted); font: 600 11px/14px var(--font-sans); cursor: pointer; border-radius: 16px; }
.ha-tabbar-item.on { color: var(--on-frame); background: var(--frame-hover); }
.ha-tabbar-item:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.ha-tabbar-ico { position: relative; display: inline-flex; }
.ha-tabbar-ico .ha-dotcount { top: -6px; right: -10px; box-shadow: 0 0 0 2px var(--frame); }
.ha-push { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 360px; padding: 12px 16px; border-radius: 20px; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(16px); box-shadow: var(--shadow-float); }
.ha-push-top { display: flex; justify-content: space-between; font: 600 11px/14px var(--font-sans); color: var(--ink-muted); text-transform: uppercase; letter-spacing: .06em; }
.ha-push b { font: 700 14px/20px var(--font-sans); } .ha-push p { margin: 0; font: 500 13px/18px var(--font-sans); }
.ha-push-actions { display: grid; grid-auto-flow: column; gap: 4px; margin-top: 8px; }
.ha-push-actions button { min-height: 36px; border: 0; border-radius: 12px; background: var(--surface-sunken); color: var(--ink); font: 600 13px/18px var(--font-sans); cursor: pointer; }
.ha-prsum { display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ha-prsum-head { display: flex; align-items: center; gap: 12px; } .ha-prsum-head .ha-option-text { flex: 1; padding: 0; }
.ha-prsum-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ha-prsum-list li { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 4px 12px; border-radius: var(--radius-sm); background: var(--canvas); }
.ha-prsum-list .ha-option-text { padding: 0; }
.ha-prsum-op { width: 16px; text-align: center; font: 700 14px/1 var(--font-mono); }
.op-add .ha-prsum-op { color: var(--ok); } .op-remove .ha-prsum-op { color: var(--danger); } .op-change .ha-prsum-op { color: var(--warn); }
.ha-modules { display: flex; flex-direction: column; gap: 4px; }
.ha-module { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 12px; border-radius: var(--radius-md); }
.ha-module:hover { background: var(--canvas); } .ha-module > .ha-option-text { flex: 1; padding: 0; }
.ha-module-v { font-weight: 500; color: var(--ink-muted); font-size: 12px; }
.ha-module-adds { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 40%; }
.ha-module-lock { color: var(--ink-muted); display: inline-grid; place-items: center; width: 40px; }
@media (max-width: 900px) { .ha-chatws, .ha-chatws.with-details { grid-template-columns: minmax(0, 1fr); } .ha-chatws-details { display: none !important; } .ha-settings-row { grid-template-columns: minmax(0, 1fr); gap: 12px; } .ha-sig, .ha-attprev { grid-template-columns: minmax(0, 1fr); } .ha-domainrow { grid-template-columns: 12px minmax(0, 1fr) auto; } .ha-domainrow-cell:last-child { display: none; } .ha-inbox-row { grid-template-columns: 12px minmax(0, 1fr) auto; } .ha-inbox-row .ha-family { display: none; } }
@media (prefers-reduced-motion: reduce) { .ha-shape-pulse, .ha-voice-wave i, .ha-stage.st-running::after, .ha-log-line.fresh { animation: none !important; } }
.ha-approval-mail { padding: 12px 16px; border-radius: var(--radius-md); background: var(--canvas); font: 500 13px/20px var(--font-sans); white-space: pre-wrap; overflow-wrap: anywhere; }
.ha-approval-body > .ha-approval-mail { padding: 0; background: none; }

/* ════════ Kit 5: admin and real-estate components ════════ */
.ha-mono { font-family: var(--font-mono); }

/* Range slider */
.ha-range { display: flex; flex-direction: column; gap: 12px; }
.ha-range-track { position: relative; height: 20px; }
.ha-range-track::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 4px; border-radius: var(--radius-pill); background: var(--surface-sunken); }
.ha-range-track > span { position: absolute; top: 8px; height: 4px; border-radius: var(--radius-pill); background: var(--accent); }
.ha-range-track input { position: absolute; inset: 0; width: 100%; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.ha-range-track input::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 2px var(--accent), var(--shadow-card); cursor: grab; }
.ha-range-track input::-moz-range-thumb { pointer-events: auto; width: 20px; height: 20px; border: 0; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 2px var(--accent); cursor: grab; }
.ha-range-track input:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--focus); outline-offset: 2px; }
.ha-range-inputs { display: flex; align-items: flex-end; gap: 8px; }
.ha-range-num { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; position: relative; }
.ha-range-num small { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.ha-range-num .ha-input { font-variant-numeric: tabular-nums; padding-right: 40px; }
.ha-range-num > span { position: absolute; right: 16px; bottom: 11px; font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }
.ha-range-dash { padding-bottom: 10px; color: var(--ink-muted); }
.ha-range-vals { display: flex; justify-content: space-between; font: 600 13px/18px var(--font-sans); font-variant-numeric: tabular-nums; }

/* Bar list */
.ha-barlist { display: flex; flex-direction: column; gap: 4px; }
.ha-barlist-row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 36px; padding: 0 12px; border-radius: var(--radius-sm); overflow: hidden; }
.ha-barlist-row.is-btn { cursor: pointer; } .ha-barlist-row.is-btn:hover { background: var(--surface-sunken); }
.ha-barlist-bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: var(--radius-sm); background: var(--sky); opacity: .7; }
.ha-barlist-label, .ha-barlist-val { position: relative; font: 500 13px/18px var(--font-sans); }
.ha-barlist-label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ha-barlist-val { font-weight: 700; font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: baseline; }
.ha-barlist-val small { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); min-width: 40px; text-align: right; }

/* Status select */
.ha-statussel { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 12px; border: 0; border-radius: var(--radius-pill); background: var(--surface-sunken); color: var(--ink); font: 600 12px/16px var(--font-sans); cursor: pointer; white-space: nowrap; }
.ha-statussel.sm { min-height: 28px; padding: 0 10px; }
.ha-statussel:hover { background: var(--line); }
.ha-statussel:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ha-menu-item.on { background: var(--surface-sunken); }

/* Tile picker */
.ha-tiles { display: grid; gap: 12px; }
.ha-tile { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 0; border-radius: var(--radius-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); text-align: left; cursor: pointer; }
.ha-tile:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.ha-tile.on { box-shadow: inset 0 0 0 2px var(--accent); }
.ha-tile:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ha-tile:disabled { opacity: .45; cursor: not-allowed; }
.ha-tile-art { display: grid; place-items: center; aspect-ratio: 4 / 3; border-radius: var(--radius-sm); overflow: hidden; }
.ha-tile-art img { width: 100%; height: 100%; object-fit: cover; }
.ha-tile-label { display: flex; flex-direction: column; padding: 0 4px 4px; font: 600 13px/18px var(--font-sans); }
.ha-tile-label small { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.ha-tile-check { position: absolute; top: 14px; right: 14px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); }

/* Live feed */
.ha-livefeed { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ha-livefeed-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ha-live { display: inline-flex; align-items: center; gap: 8px; font: 700 12px/16px var(--font-sans); text-transform: uppercase; letter-spacing: .04em; color: var(--ok); }
.ha-live-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 currentColor; animation: ha-live 1.6s var(--ease-out) infinite; }
.ha-live.off { color: var(--ink-muted); } .ha-live.off .ha-live-dot { animation: none; }
@keyframes ha-live { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 45%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
.ha-livefeed-new { border: 0; border-radius: var(--radius-pill); padding: 4px 12px; background: var(--count); color: var(--on-count); font: 700 12px/16px var(--font-sans); cursor: pointer; }
.ha-livefeed-list { display: flex; flex-direction: column; gap: 4px; max-height: 420px; overflow: auto; }
.ha-livefeed-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; border-radius: var(--radius-md); }
.ha-livefeed-row.fresh { animation: ha-fresh 2.4s var(--ease-out); }
@keyframes ha-fresh { 0% { background: var(--surface-sunken); transform: translateY(-4px); opacity: 0; } 15% { opacity: 1; transform: none; } 100% { background: transparent; } }
.ha-livefeed-text { flex: 1; min-width: 0; display: flex; flex-direction: column; font: 500 13px/18px var(--font-sans); }
.ha-livefeed-text b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ha-livefeed-text small { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ha-livefeed-amt { font: 700 13px/18px var(--font-sans); font-variant-numeric: tabular-nums; color: var(--ok); }
.ha-livefeed-amt.neg { color: var(--danger); }
.ha-livefeed-time { font: 500 12px/16px var(--font-mono); color: var(--ink-muted); min-width: 56px; text-align: right; }

/* Map */
.ha-map { position: relative; border-radius: var(--radius-md); background: var(--surface-sunken); overflow: hidden; isolation: isolate; }
.ha-map > :first-child:not(button) { position: absolute; inset: 0; width: 100%; height: 100%; }
.ha-map-grid line { stroke: var(--line); stroke-width: .15; vector-effect: non-scaling-stroke; }
.ha-map-pin, .ha-map-bubble { position: absolute; transform: translate(-50%, -50%); border: 0; cursor: pointer; z-index: 1; }
.ha-map-pin { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 28px; height: 28px; padding: 0 8px; border-radius: var(--radius-pill); box-shadow: 0 0 0 2px var(--surface), var(--shadow-card); font: 700 12px/16px var(--font-sans); white-space: nowrap; }
.ha-map-pin.on, .ha-map-bubble.on { z-index: 2; box-shadow: 0 0 0 2px var(--ink), var(--shadow-lift); }
.ha-map-bubble { border-radius: 50%; opacity: .85; box-shadow: 0 0 0 2px var(--surface); }
.ha-map-bubble.pulse::after, .ha-map-pin.pulse::after { content: ""; position: absolute; inset: -2px; border-radius: inherit; box-shadow: 0 0 0 0 var(--sky-ink); animation: ha-ping 1.8s var(--ease-out) infinite; }
@keyframes ha-ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 50%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
.ha-map-pin:focus-visible, .ha-map-bubble:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ha-map-pop { position: absolute; z-index: 3; transform: translate(-50%, calc(-100% - 22px)); min-width: 160px; max-width: 260px; padding: 8px 12px; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-lift); }
.ha-map-pop .ha-option-text { padding: 0; }
.ha-map-legend { position: absolute; left: 12px; bottom: 12px; z-index: 2; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--surface); box-shadow: var(--shadow-card); font: 500 12px/16px var(--font-sans); }
.ha-map-ctl { position: absolute; right: 12px; top: 12px; z-index: 2; display: flex; flex-direction: column; gap: 4px; }

/* Rich text editor */
.ha-rte { display: flex; flex-direction: column; border-radius: var(--radius-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); overflow: hidden; }
.ha-rte:focus-within { box-shadow: inset 0 0 0 2px var(--ink); }
.ha-rte.invalid { box-shadow: inset 0 0 0 2px var(--danger); }
.ha-rte-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--canvas); }
.ha-rte-btn { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: var(--radius-sm); background: none; color: var(--ink); cursor: pointer; }
.ha-rte-btn:hover { background: var(--surface-sunken); }
.ha-rte-btn:focus-visible, .ha-rte-var:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.ha-rte-sep { width: 1px; height: 18px; margin: 0 4px; background: var(--line); }
.ha-rte-var { display: inline-flex; align-items: center; gap: 6px; height: 32px; margin-left: auto; padding: 0 12px; border: 0; border-radius: var(--radius-pill); background: var(--surface-sunken); color: var(--ink); font: 600 12px/16px var(--font-sans); cursor: pointer; }
.ha-rte-var { font-family: var(--font-mono); } .ha-rte-var span { font-family: var(--font-sans); }
.ha-rte-area { padding: 16px; outline: 0; font: 500 14px/22px var(--font-sans); color: var(--ink); overflow-wrap: anywhere; }
.ha-rte-area:empty::before { content: attr(data-placeholder); color: var(--ink-subtle); }
.ha-rte-area h3 { margin: 8px 0 4px; font: 700 17px/24px var(--font-sans); }
.ha-rte-area blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--line-strong); color: var(--ink-muted); }
.ha-rte-area a { color: var(--sky-ink); }
.ha-rte-area ul, .ha-rte-area ol { margin: 4px 0; padding-left: 24px; }
.ha-rte-foot { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-top: 1px solid var(--line); font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.ha-rte-count { margin-left: auto; font-variant-numeric: tabular-nums; } .ha-rte-count.over { color: var(--danger); font-weight: 700; }
.ha-menu code { font: 500 11px/16px var(--font-mono); color: var(--ink-muted); }

/* Email preview */
.ha-mailprev { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ha-mailprev-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.ha-mailprev-inbox { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 280px; padding: 8px 12px; border-radius: var(--radius-md); background: var(--surface-sunken); }
.ha-mailprev-inbox .ha-option-text { padding: 0; }
.ha-mailprev-subj { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ha-mailprev-subj b { color: var(--ink); font-weight: 600; }
.ha-mailprev-stage { display: flex; justify-content: center; padding: 16px; border-radius: var(--radius-md); background: var(--canvas); }
.ha-mailprev-frame { width: 100%; max-width: 640px; border-radius: var(--radius-sm); background: var(--paper); color: var(--paper-ink); box-shadow: var(--shadow-card); overflow: hidden; transition: max-width var(--dur-base) var(--ease-out); }
.ha-mailprev-stage.mobile .ha-mailprev-frame { max-width: 375px; border-radius: 24px; box-shadow: 0 0 0 8px var(--frame), var(--shadow-lift); }
.ha-mailprev-frame iframe { display: block; width: 100%; height: 480px; border: 0; background: var(--paper); }
.ha-mailprev-body { padding: 24px; font: 500 14px/22px var(--font-sans); }
.ha-mailprev-checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }

/* Search ad preview */
.ha-adprev { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ha-adprev-card { width: 100%; max-width: 600px; box-sizing: border-box; padding: 16px; border-radius: var(--radius-md); background: var(--paper); color: var(--serp-ink); box-shadow: var(--shadow-card); font-family: Arial, var(--font-sans); }
.ha-adprev-card.mobile { max-width: 380px; border-radius: 20px; }
.ha-adprev-top { display: flex; align-items: center; gap: 12px; }
.ha-adprev-top .ha-option-text { padding: 0; } .ha-adprev-top b { font: 400 14px/20px Arial, var(--font-sans); color: var(--serp-ink); } .ha-adprev-top small { font: 400 12px/18px Arial, var(--font-sans); color: var(--serp-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ha-adprev-fav { display: grid; place-items: center; width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--serp-chip); font: 700 12px/1 Arial, var(--font-sans); color: var(--serp-ink); }
.ha-adprev-tag { margin-left: auto; font: 700 12px/16px Arial, var(--font-sans); color: var(--serp-ink); }
.ha-adprev-hl { display: block; margin: 8px 0 4px; font: 400 20px/26px Arial, var(--font-sans); color: var(--serp-link); text-decoration: none; overflow-wrap: anywhere; }
.ha-adprev-card.mobile .ha-adprev-hl { font-size: 18px; line-height: 24px; }
.ha-adprev-desc { margin: 0; font: 400 14px/22px Arial, var(--font-sans); color: var(--serp-muted); }
.ha-adprev-links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font: 400 14px/20px Arial, var(--font-sans); color: var(--serp-link); }

/* Balance card */
.ha-balance { display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-card); min-width: 0; }
.ha-balance-head { display: flex; align-items: center; gap: 12px; } .ha-balance-head .ha-option-text { padding: 0; }
.ha-balance-head b { font: 700 14px/20px var(--font-sans); }
.ha-balance-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.ha-balance-amt { font: 700 28px/34px var(--font-sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ha-balance.is-danger .ha-balance-amt { color: var(--danger); }
.ha-balance-meta { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }

/* Service monitor, runs, backups, blocks */
.ha-svcmon, .ha-runs, .ha-backups, .ha-blocks { display: flex; flex-direction: column; gap: 4px; }
.ha-svcmon-row, .ha-backups-row, .ha-blocks-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 4px 16px; border-radius: var(--radius-md); }
.ha-svcmon-row:hover, .ha-backups-row:hover, .ha-blocks-row:hover { background: var(--canvas); }
.ha-svcmon-row .ha-option-text, .ha-backups-row .ha-option-text, .ha-blocks-row .ha-option-text { flex: 1; padding: 0; }
.ha-svcmon-row b, .ha-backups-row b, .ha-blocks-row b, .ha-runs-main b { font: 600 13px/18px var(--font-sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ha-svcmon-hist { display: flex; gap: 2px; }
.ha-svcmon-hist i { width: 4px; height: 20px; border-radius: 2px; background: currentColor; opacity: .85; }
.ha-svcmon-hist i.ha-st-none { color: var(--line); }
.ha-svcmon-num { min-width: 64px; text-align: right; font: 600 12px/16px var(--font-mono); font-variant-numeric: tabular-nums; }
.ha-svcmon-num.bad { color: var(--danger); }
.ha-svcmon-time, .ha-blocks-meta { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); white-space: nowrap; }
.ha-runs-row { border-radius: var(--radius-md); }
.ha-runs-row.open { background: var(--canvas); }
.ha-runs-main { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 4px 16px; border: 0; border-radius: var(--radius-md); background: none; color: var(--ink); text-align: left; font: inherit; }
button.ha-runs-main[aria-expanded] { cursor: pointer; } button.ha-runs-main[aria-expanded]:hover { background: var(--canvas); }
.ha-runs-main:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.ha-runs-main .ha-option-text { flex: 1; padding: 0; }
.ha-runs-counts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 12px; font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.ha-runs-counts b { color: var(--ink); font-variant-numeric: tabular-nums; }
.ha-runs-counts .ha-tone-danger b { color: var(--danger); } .ha-runs-counts .ha-tone-success b { color: var(--ok); }
.ha-runs-detail { padding: 0 16px 16px 36px; }
.ha-backups-size { font: 600 12px/16px var(--font-mono); color: var(--ink-muted); }
.ha-backups-foot { padding: 8px 16px; font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.ha-blocks-row > .ha-ico { color: var(--danger); }

/* Webhook */
.ha-hook { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ha-hook-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; } .ha-hook-head .ha-option-text { padding: 0; }
.ha-hook-url { font: 600 13px/18px var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ha-hook-rate { font: 700 12px/16px var(--font-sans); font-variant-numeric: tabular-nums; }
.ha-hook-dl { display: flex; flex-direction: column; }
.ha-hook-dl-row { display: flex; align-items: center; gap: 12px; min-height: 40px; border-bottom: 1px solid var(--line); font: 500 12px/16px var(--font-sans); }
.ha-hook-dl-row:last-child { border-bottom: 0; }
.ha-hook-dl-row .ha-mono { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ha-hook-code { min-width: 40px; padding: 2px 6px; border-radius: 6px; text-align: center; font: 700 11px/16px var(--font-mono); }
.ha-hook-code.ok { background: var(--ok-bg); color: var(--ok); } .ha-hook-code.bad { background: var(--danger-bg); color: var(--danger); }
.ha-hook-dl-time { color: var(--ink-muted); white-space: nowrap; }

/* Review */
.ha-review { display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-card); }
.ha-review.is-pending { box-shadow: inset 3px 0 0 var(--signal), var(--shadow-card); }
.ha-review.is-hidden { opacity: .72; }
.ha-review-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; } .ha-review-head .ha-option-text { padding: 0; min-width: 160px; }
.ha-review-ver { font-weight: 500; color: var(--ok); }
.ha-review-title { font: 700 15px/22px var(--font-sans); }
.ha-review-text { margin: 0; font: 500 14px/22px var(--font-sans); }
.ha-review-text mark { background: var(--butter); color: var(--butter-ink); border-radius: 4px; padding: 0 2px; }
.ha-review-reply { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--canvas); font: 500 13px/20px var(--font-sans); }
.ha-review-reply small { font: 600 12px/16px var(--font-sans); color: var(--ink-muted); }
.ha-review-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Coupon */
.ha-coupon { display: flex; align-items: stretch; gap: 0; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-card); overflow: hidden; }
.ha-coupon.off { opacity: .7; }
.ha-coupon-val { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 96px; padding: 16px; background: var(--mint); color: var(--mint-ink); border-right: 2px dashed var(--surface); position: relative; }
.ha-coupon-val b { font: 800 24px/28px var(--font-sans); letter-spacing: -.02em; }
.ha-coupon-val small { font: 600 12px/16px var(--font-sans); }
.ha-coupon.off .ha-coupon-val { background: var(--surface-sunken); color: var(--ink-muted); }
.ha-coupon-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; }
.ha-coupon > .ha-pop-anchor { padding: 12px 12px 0 0; }
.ha-coupon-code { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); background: none; color: var(--ink); font: 700 13px/18px var(--font-mono); letter-spacing: .04em; cursor: pointer; }
.ha-coupon-code:hover { background: var(--canvas); }
.ha-coupon-text, .ha-coupon-foot { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }

/* Locale field and switchers */
.ha-locfield { display: flex; flex-direction: column; gap: 8px; }
.ha-locfield-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.ha-locfield-tab { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: var(--radius-pill); background: none; color: var(--ink-muted); font: 700 12px/16px var(--font-sans); cursor: pointer; }
.ha-locfield-tab:hover { background: var(--surface-sunken); color: var(--ink); }
.ha-locfield-tab.on { background: var(--accent); color: var(--on-accent); }
.ha-locfield-tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ha-locfield-miss { width: 6px; height: 6px; transform: rotate(45deg); background: var(--warn); }
.ha-locfield-done { margin-left: auto; font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.ha-locsw, .ha-wssw { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 0; border-radius: var(--radius-pill); background: var(--surface-sunken); color: var(--ink); font: 600 13px/18px var(--font-sans); cursor: pointer; max-width: 100%; }
.ha-locsw:focus-visible, .ha-wssw:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ha-locsw.on-frame, .ha-wssw.on-frame { background: var(--frame-hover); color: var(--on-frame); }
.ha-locsw-cur { padding-left: 8px; border-left: 1px solid var(--line-strong); color: var(--ink-muted); }
.ha-locsw.on-frame .ha-locsw-cur { color: var(--on-frame-muted); border-color: var(--frame-strong); }
.ha-wssw { padding: 4px 14px 4px 4px; min-height: 44px; }
.ha-wssw .ha-option-text { padding: 0; text-align: left; } .ha-wssw .ha-option-text small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ha-wssw.on-frame .ha-option-text small { color: var(--on-frame-muted); }
.ha-wssw-mark { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 50%; font: 800 14px/1 var(--font-sans); }
.ha-wssw-mark.sm { width: 28px; height: 28px; font-size: 12px; }
.ha-menu-item .ha-option-text { padding: 0; }

/* Export, 2FA */
.ha-export { max-width: 480px; }
.ha-export-cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px 16px; max-height: 200px; overflow: auto; padding: 4px 0; }
.ha-2fa { display: flex; flex-direction: column; gap: 20px; }
.ha-2fa-steps { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0; padding: 0; list-style: none; }
.ha-2fa-steps li { display: flex; align-items: center; gap: 8px; font: 600 13px/18px var(--font-sans); color: var(--ink-muted); }
.ha-2fa-steps li span { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-sunken); font: 700 12px/1 var(--font-sans); }
.ha-2fa-steps li.on { color: var(--ink); } .ha-2fa-steps li.on span { background: var(--accent); color: var(--on-accent); }
.ha-2fa-steps li.done span { background: var(--ok-bg); color: var(--ok); }
.ha-2fa-scan { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.ha-2fa-qr { display: grid; place-items: center; width: 168px; height: 168px; flex: none; padding: 12px; box-sizing: border-box; border-radius: var(--radius-md); background: var(--paper); color: var(--paper-ink); box-shadow: inset 0 0 0 1px var(--line); }
.ha-2fa-qr > * { max-width: 100%; max-height: 100%; }
.ha-2fa-scan > .ha-col { flex: 1 1 220px; }
.ha-2fa-key { display: inline-flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); background: var(--canvas); color: var(--ink); font: 600 13px/18px var(--font-mono); letter-spacing: .04em; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
.ha-2fa-codes { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; padding: 16px; border-radius: var(--radius-md); background: var(--canvas); }
.ha-2fa-codes code { font: 600 13px/20px var(--font-mono); letter-spacing: .04em; }

/* Image variants, gallery, before/after */
.ha-imgvar { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.ha-imgvar-stage { position: relative; display: grid; place-items: center; min-height: 220px; border-radius: var(--radius-md); background: repeating-conic-gradient(var(--surface-sunken) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; overflow: hidden; transition: aspect-ratio var(--dur-base) var(--ease-out); }
.ha-imgvar-stage img { width: 100%; height: 100%; object-fit: cover; }
.ha-imgvar-ph { display: grid; place-items: center; width: 100%; height: 100%; }
.ha-imgvar-tag { position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--surface); font: 700 12px/16px var(--font-sans); box-shadow: var(--shadow-card); }
.ha-imgvar-list { display: flex; flex-direction: column; gap: 4px; }
.ha-imgvar-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border: 0; border-radius: var(--radius-md); background: none; color: var(--ink); text-align: left; cursor: pointer; }
.ha-imgvar-item:hover { background: var(--canvas); } .ha-imgvar-item.on { background: var(--surface-sunken); }
.ha-imgvar-item:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.ha-imgvar-item .ha-option-text { padding: 0; } .ha-imgvar-item b { font: 600 13px/18px var(--font-sans); }
.ha-imgvar-thumb { display: grid; place-items: center; width: 44px; max-height: 44px; aspect-ratio: 1; flex: none; border-radius: 8px; background: var(--surface-sunken); color: var(--ink-muted); overflow: hidden; }
.ha-imgvar-thumb img { width: 100%; height: 100%; object-fit: cover; }
.ha-gallery { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ha-gallery-stage, .ha-lightbox-stage { position: relative; border-radius: var(--radius-md); overflow: hidden; background: var(--surface-sunken); }
.ha-gallery-img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ha-gallery-ph { display: grid; place-items: center; }
.ha-gallery-prev, .ha-gallery-next { position: absolute; top: 50%; transform: translateY(-50%); background: var(--surface) !important; box-shadow: var(--shadow-card); }
.ha-gallery-prev { left: 12px; } .ha-gallery-next { right: 12px; }
.ha-gallery-full { position: absolute; right: 12px; top: 12px; background: var(--surface) !important; }
.ha-gallery-count, .ha-gallery-badge { position: absolute; bottom: 12px; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--media-scrim); color: var(--media-ink); font: 700 12px/16px var(--font-sans); }
.ha-gallery-count { right: 12px; } .ha-gallery-badge { left: 12px; }
.ha-gallery-thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.ha-gallery-thumbs button { flex: none; width: 72px; height: 52px; padding: 0; border: 0; border-radius: var(--radius-sm); overflow: hidden; background: var(--surface-sunken); cursor: pointer; opacity: .6; }
.ha-gallery-thumbs button.on { opacity: 1; box-shadow: inset 0 0 0 2px var(--accent); }
.ha-gallery-thumbs button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ha-gallery-thumb { width: 100%; height: 100%; object-fit: cover; }
.ha-lightbox { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 48px 16px; background: var(--lightbox); }
.ha-lightbox-stage { width: min(1100px, 100%); aspect-ratio: 3 / 2; max-height: calc(100vh - 140px); background: none; }
.ha-lightbox-stage .ha-gallery-img { object-fit: contain; }
.ha-lightbox-close { position: absolute; right: 16px; top: 16px; background: var(--frame-active) !important; color: var(--media-ink) !important; }
.ha-lightbox-cap { color: var(--lightbox-ink); font: 500 13px/18px var(--font-sans); }
.ha-ba { position: relative; border-radius: var(--radius-md); overflow: hidden; background: var(--surface-sunken); touch-action: none; user-select: none; cursor: ew-resize; }
.ha-ba-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: grid; place-items: center; }
.ha-ba-before { position: absolute; inset: 0; }
.ha-ba-tag { position: absolute; top: 12px; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--media-scrim); color: var(--media-ink); font: 700 12px/16px var(--font-sans); }
.ha-ba-tag.left { left: 12px; } .ha-ba-tag.right { right: 12px; }
.ha-ba-line { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--media-ink); box-shadow: 0 0 8px var(--media-shadow); }
.ha-ba-knob { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: var(--media-ink); color: var(--paper-ink); box-shadow: var(--shadow-lift); cursor: ew-resize; }
.ha-ba-knob:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Listing */
.ha-listing { display: flex; flex-direction: column; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-card); overflow: hidden; min-width: 0; cursor: default; transition: box-shadow var(--dur-fast) var(--ease-out); }
.ha-listing[class*="ha-listing"]:hover { box-shadow: var(--shadow-lift); }
.ha-listing.selected { box-shadow: inset 0 0 0 2px var(--accent), var(--shadow-card); }
.ha-listing.row { flex-direction: row; }
.ha-listing-media { position: relative; aspect-ratio: 4 / 3; background: var(--surface-sunken); flex: none; }
.ha-listing.row .ha-listing-media { width: 240px; aspect-ratio: auto; min-height: 160px; }
.ha-listing-media img, .ha-listing-ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: grid; place-items: center; }
.ha-listing-new { position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--accent); color: var(--on-accent); font: 700 12px/16px var(--font-sans); }
.ha-listing-photos { position: absolute; right: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: var(--radius-pill); background: var(--media-scrim); color: var(--media-ink); font: 700 11px/14px var(--font-sans); }
.ha-listing-sel { position: absolute; right: 12px; top: 12px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-card); }
.ha-listing-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 16px 20px 16px; }
.ha-listing-top { display: flex; align-items: center; gap: 8px; }
.ha-listing-price { font: 800 20px/26px var(--font-sans); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.ha-listing-price small { font: 600 13px/18px var(--font-sans); color: var(--ink-muted); }
.ha-listing-ppsqm { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.ha-listing-wish { margin-left: auto; } .ha-listing-wish.on { color: var(--danger); }
.ha-listing-title { font: 600 14px/20px var(--font-sans); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ha-listing.unread .ha-listing-title::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--info); vertical-align: 2px; }
.ha-listing-facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }
.ha-listing-facts span { display: inline-flex; align-items: center; gap: 6px; }
.ha-listing-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; }
.ha-listing-src { padding: 2px 8px; border-radius: 6px; background: var(--surface-sunken); font: 700 11px/16px var(--font-sans); }
.ha-listing-flag { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); }
.ha-listing-age { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
@media (max-width: 640px) { .ha-listing.row { flex-direction: column; } .ha-listing.row .ha-listing-media { width: auto; aspect-ratio: 4 / 3; min-height: 0; } }

/* Results toolbar, saved search */
.ha-results { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ha-results .ha-option-text { padding: 0; } .ha-results .ha-option-text b { font: 700 15px/20px var(--font-sans); }
.ha-results-sort { display: inline-flex; align-items: center; gap: 8px; font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }
.ha-results-sort .ha-input { height: 32px; width: auto; padding: 0 32px 0 12px; font-size: 13px; }
.ha-saved { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ha-saved.off { opacity: .7; }
.ha-saved-head { display: flex; align-items: center; gap: 12px; } .ha-saved-head .ha-option-text { padding: 0; }
.ha-saved-crit { display: flex; flex-wrap: wrap; gap: 6px; }
.ha-saved-chip { padding: 4px 10px; border-radius: var(--radius-pill); background: var(--surface-sunken); font: 600 12px/16px var(--font-sans); }

/* Valuation, energy */
.ha-valuation { display: flex; flex-direction: column; gap: 8px; }
.ha-valuation-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ha-valuation-val { font: 800 32px/38px var(--font-sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ha-valuation-sub { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }
.ha-valuation-range { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 4px; }
.ha-valuation-bar { position: relative; height: 10px; border-radius: var(--radius-pill); background: linear-gradient(90deg, var(--mint), var(--sky) 50%, var(--butter)); }
.ha-valuation-mark { position: absolute; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 4px var(--ink), var(--shadow-card); }
.ha-valuation-ask { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--danger); border-radius: 1px; }
.ha-valuation-ends { display: flex; justify-content: space-between; font: 600 12px/16px var(--font-sans); color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.ha-valuation-diff { font: 600 13px/18px var(--font-sans); } .ha-valuation-diff.bad { color: var(--danger); } .ha-valuation-diff.good { color: var(--ok); }
.ha-energy { display: flex; flex-direction: column; gap: 8px; }
.ha-energy-scale { display: grid; gap: 2px; }
.ha-energy-c { display: grid; place-items: center; height: 28px; background: color-mix(in srgb, var(--mint) calc((1 - var(--e)) * 100%), var(--blush)); color: var(--ink); font: 700 11px/1 var(--font-sans); opacity: .55; }
.ha-energy-c:first-child { border-radius: var(--radius-pill) 0 0 var(--radius-pill); } .ha-energy-c:last-child { border-radius: 0 var(--radius-pill) var(--radius-pill) 0; }
.ha-energy-c.on { opacity: 1; transform: scaleY(1.25); border-radius: 6px; box-shadow: 0 0 0 2px var(--ink); font-size: 13px; z-index: 1; }
.ha-energy-meta { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }

/* Launcher, cookie consent, announcement, colour field */
.ha-launch { position: fixed; right: 24px; bottom: 24px; z-index: 70; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.ha-launch.inline { position: relative; right: auto; bottom: auto; }
.ha-launch-btn { position: relative; display: grid; place-items: center; width: 56px; height: 56px; border: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-float); cursor: pointer; }
.ha-launch-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.ha-launch-btn .ha-nav-count { position: absolute; top: -2px; right: -2px; }
.ha-launch-panel { display: flex; flex-direction: column; width: min(400px, calc(100vw - 32px)); height: min(560px, calc(100vh - 120px)); border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-float); overflow: hidden; animation: ha-pop var(--dur-base) var(--ease-spring) both; transform-origin: bottom right; }
.ha-launch-head { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); } .ha-launch-head .ha-option-text { padding: 0; }
.ha-launch-body { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.ha-launch-foot { padding: 12px; border-top: 1px solid var(--line); }
.ha-cookie { position: fixed; left: 24px; bottom: 24px; z-index: 75; display: flex; flex-direction: column; gap: 16px; width: min(440px, calc(100vw - 32px)); box-sizing: border-box; padding: 20px; border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-float); }
.ha-cookie.inline { position: relative; left: auto; bottom: auto; }
.ha-cookie-cats { display: flex; flex-direction: column; gap: 4px; }
.ha-cookie-cat { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: var(--radius-md); background: var(--canvas); }
.ha-cookie-cat .ha-option-text { padding: 0; }
.ha-cookie-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.ha-cookie-actions .ha-btn { flex: 1 1 auto; }
.ha-announce { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 40px; padding: 8px 48px; position: relative; font: 600 13px/18px var(--font-sans); text-align: center; }
.ha-announce a { color: inherit; font-weight: 700; }
.ha-announce-x { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 50%; background: none; color: inherit; cursor: pointer; }
.ha-announce-x:hover { background: var(--ink-hover); }
.ha-colorf { display: flex; align-items: center; gap: 8px; }
.ha-colorf-sw { position: relative; width: 40px; height: 40px; flex: none; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--hairline); cursor: pointer; overflow: hidden; }
.ha-colorf-sw input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.ha-colorf-sw:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.ha-colorf .ha-input { flex: 1; min-width: 0; text-transform: lowercase; }
.ha-colorf-ratio { flex: none; padding: 4px 10px; border-radius: var(--radius-pill); font: 700 12px/16px var(--font-sans); white-space: nowrap; }
.ha-colorf-ratio.ok { background: var(--ok-bg); color: var(--ok); } .ha-colorf-ratio.warn { background: var(--warn-bg); color: var(--warn); } .ha-colorf-ratio.bad { background: var(--danger-bg); color: var(--danger); }

@media (max-width: 900px) {
  .ha-imgvar { grid-template-columns: 1fr; }
  .ha-svcmon-hist, .ha-svcmon-time { display: none; }
  .ha-runs-counts { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .ha-live-dot, .ha-map-bubble.pulse::after, .ha-map-pin.pulse::after, .ha-livefeed-row.fresh { animation: none; }
}
.ha-map-world { position: absolute; inset: 0; width: 100%; height: 100%; }
.ha-map-world path { stroke: var(--line-strong); stroke-width: 3px; stroke-linecap: round; fill: none; vector-effect: non-scaling-stroke; }
.ha-tile-art:not([class*="ha-t-"]) { background: var(--surface-sunken); }
.ha-gallery-stage > .ha-gallery-img, .ha-lightbox-stage > .ha-gallery-img { position: absolute; inset: 0; }
.ha-gallery-ph { position: relative; width: 100%; height: 100%; overflow: hidden; }
.ha-rte-btn.on { background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--line-strong); }
.ha-rte-btn:disabled { opacity: .45; cursor: not-allowed; }
.ha-rte-area p { margin: 0 0 8px; } .ha-rte-area p:last-child { margin-bottom: 0; }
.ha-rte-area:has(> p:only-child > br:only-child)::before { content: attr(data-placeholder); position: absolute; color: var(--ink-subtle); pointer-events: none; }
.ha-rte-area { position: relative; }
/* Layout: Halo app shell — top bar picks the area, the side nav lists that area's pages; main + optional side panel; one column on phones */
body { background: var(--canvas); color: var(--ink); padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app { max-width: 1520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.demo-banner { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }
.demo-shell { position: relative; }
.demo-mono { font-family: var(--font-mono); font-size: .92em; }
.demo-ellipsis { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 100%; }

/* Sheet: side nav | main | optional side panel */
.demo-sheet { display: grid; grid-template-columns: 208px minmax(0, 1fr); gap: var(--space-6); padding: var(--space-6); background: var(--canvas); border-radius: calc(var(--radius-xl) - 8px); align-items: start; animation: ha-fade var(--dur-enter) var(--ease-out) both; }
.demo-sheet.has-side { grid-template-columns: 208px minmax(0, 1fr) 304px; }
.demo-sheet > .ha-panel.ha-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.demo-main { min-width: 0; min-height: 62vh; }
.ha-main-dock { padding-bottom: 96px; }
.ha-dock-float { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: 50%; transform: translateX(-50%); z-index: 40; }

/* Side nav: the pages of the current area plus its main create action */
.demo-subnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 16px; animation: ha-fade var(--dur-enter) var(--ease-out) both; }
.demo-subnav-head { display: flex; flex-direction: column; gap: 12px; }
.demo-subnav-eyebrow { font: 600 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); padding: 0 12px; }
.demo-subnav-action { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border: 0; border-radius: var(--radius-pill); background: var(--accent); color: var(--on-accent); font: 600 13px/18px var(--font-sans); cursor: pointer; transition: transform var(--dur-fast) var(--ease-out); }
.demo-subnav-action:active { transform: scale(.97); }
.demo-subnav-list { display: flex; flex-direction: column; gap: 2px; }
.demo-subnav-item { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--ink-muted); font: 600 13px/18px var(--font-sans); cursor: pointer; text-align: left; transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
.demo-subnav-item:hover { background: var(--surface-sunken); color: var(--ink); }
.demo-subnav-item[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); }
.demo-subnav-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-subnav-count { min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: var(--radius-pill); background: var(--count); color: var(--on-count); font: 700 11px/20px var(--font-sans); text-align: center; }
.demo-subnav-labels { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.demo-subnav-tag { display: flex; align-items: center; gap: 12px; padding: 0 12px; font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }
.demo-subnav-tag i { width: 8px; height: 8px; border-radius: 50%; }
.demo-subnav-item:focus-visible, .demo-subnav-action:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* User menu */
.demo-usermenu { position: absolute; top: 64px; right: 32px; z-index: 55; display: flex; flex-direction: column; gap: 8px; width: 260px; padding: 8px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-float); animation: ha-pop var(--dur-base) var(--ease-spring) both; transform-origin: top right; }
.demo-usermenu .ha-menu { box-shadow: none; padding: 0; min-width: 0; animation: none; }
.demo-usermenu-head { display: flex; align-items: center; gap: 12px; padding: 8px 12px 12px; border-bottom: 1px solid var(--line); }

/* Grids */
.demo-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.demo-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.demo-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.demo-21 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.demo-12 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
.demo-split { display: grid; grid-template-columns: minmax(0, 1fr) 304px; gap: var(--space-4); align-items: start; }
.demo-split-wide { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: var(--space-4); align-items: start; }
.demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.demo-scroll { overflow-x: auto; min-width: 0; -webkit-overflow-scrolling: touch; }
.demo-scroll .ha-table { min-width: 560px; }

/* Shared controls */
.demo-sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.demo-sort:hover { color: var(--ink); }
.demo-inline-select { appearance: none; border: 0; background: var(--surface-sunken); color: var(--ink); font: 600 13px/18px var(--font-sans); padding: 0 36px 0 16px; border-radius: var(--radius-pill); cursor: pointer; max-width: 100%; height: 32px; }
.demo-link { display: inline-flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; color: var(--ink); font: 700 14px/20px var(--font-sans); cursor: pointer; text-align: left; }
.demo-link:hover { text-decoration: underline; text-underline-offset: 3px; }
:where(.demo-sort, .demo-inline-select, .demo-ev, .demo-reply input, .demo-link, .demo-run-head, .demo-mail-open, .demo-star):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Board, calendar, chat bubbles */
.demo-board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
.demo-col { border-radius: var(--radius-lg); transition: box-shadow var(--dur-base) var(--ease-out); min-width: 0; }
.demo-col.over { box-shadow: 0 0 0 2px var(--focus); }
.demo-col .ha-card-foot .ha-row { gap: 4px; }
.demo-bubble { max-width: 78%; padding: 12px 16px; border-radius: 18px 18px 18px 6px; background: var(--surface-sunken); color: var(--ink); font: 500 14px/22px var(--font-sans); overflow-wrap: anywhere; white-space: pre-wrap; }
.demo-bubble.me { border-radius: 18px 18px 6px 18px; background: var(--accent); color: var(--on-accent); }
.demo-reply { margin-top: auto; display: flex; gap: 8px; align-items: center; padding: 4px 4px 4px 20px; border-radius: var(--radius-pill); background: var(--surface-sunken); min-width: 0; }
.demo-reply input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font: 500 14px/20px var(--font-sans); color: var(--ink); }
.demo-reply input::placeholder { color: var(--ink-subtle); }
.demo-cal-row { display: grid; grid-template-columns: 48px repeat(5, minmax(0, 1fr)); gap: 8px; }
.demo-cal-day { text-align: center; font: 700 13px/18px var(--font-sans); padding: 8px 0; border-radius: var(--radius-pill); }
.demo-cal-day.today { background: var(--accent); color: var(--on-accent); }
.demo-ev { position: absolute; left: 4px; right: 4px; border: 0; border-radius: 12px; padding: 8px 12px; box-sizing: border-box; overflow: hidden; text-align: left; color: var(--ink); cursor: pointer; font: inherit; transition: transform var(--dur-fast) var(--ease-out); }
.demo-ev:hover { transform: translateY(-1px); }
.demo-form { display: flex; flex-direction: column; gap: 16px; }

/* Agents */
.demo-agent-mark { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; flex: none; position: relative; }
.demo-agent-mark.sm { width: 28px; height: 28px; border-radius: 9px; }
.demo-agent-mark.live::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--mint-ink); box-shadow: 0 0 0 2px var(--surface); animation: ha-pulse 1.8s ease-out infinite; color: var(--mint-ink); }
.demo-agent-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.demo-agent-stats b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.demo-tool { display: inline-flex; align-items: center; height: 24px; padding: 0 12px; border-radius: var(--radius-pill); background: var(--surface-sunken); font: 600 12px/1 var(--font-sans); color: var(--ink-muted); }
.ha-card.ha-bg-lilac .demo-tool { background: var(--surface); }
.demo-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.demo-chat { display: grid; grid-template-columns: minmax(0, 288px) minmax(0, 1fr); gap: var(--space-4); align-items: stretch; }
.demo-chat-main { gap: 16px; height: 100%; box-sizing: border-box; min-height: 520px; }
.demo-chat-scroll { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 260px; max-height: 52vh; overflow-y: auto; padding: 4px 0; }
